[project]
name = "daesoopbot-info"
version = "0.1.0"
description = "대숲봇 (bamboozleify-bot) information pages and their web server"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "markdown-it-py>=3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]
